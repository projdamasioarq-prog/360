<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProArqui 3D</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 28px 20px;
      background: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }
    .menu {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: clamp(18px, 3vw, 42px);
      width: 100%;
    }
    .menu button {
      position: relative;
      padding: 12px 0;
      border: 0;
      background: transparent;
      color: #333;
      font: 600 10px Arial, Helvetica, sans-serif;
      letter-spacing: 1.7px;
      text-transform: uppercase;
      cursor: pointer;
    }
    .menu button::after {
      content: "";
      position: absolute;
      right: 100%;
      bottom: 5px;
      left: 0;
      height: 1px;
      background: #858585;
      transition: right .25s ease;
    }
    .menu button:hover::after { right: 0; }
    @media (max-width: 480px) {
      body { padding: 22px 14px; }
      .menu { gap: 12px 22px; }
      .menu button { font-size: 9px; letter-spacing: 1px; }
    }
  </style>
</head>
<body>
  <nav class="menu" aria-label="Menu principal">
    <button type="button">Início</button>
    <button type="button">Sobre nós</button>
    <button type="button">Projetos</button>
    <button type="button">Contato</button>
  </nav>
</body>
</html>
